name: Build XCFramework

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'ECCSDUI version to build (e.g. 1.0.36)'
        required: true
        type: string

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout ECCSDUI
        uses: actions/checkout@v4
        with:
          repository: Indroids/ECCSDUI
          token: ${{ secrets.ECCSDUI_READ_TOKEN }}

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Build XCFramework
        env:
          MARKETPLACE_CLIENTID_LOCAL: publish-placeholder
          MARKETPLACE_APIBASEURL_LOCAL: http://localhost:8082
        run: |
          ./gradlew :ecc-platform:assembleComposeAppReleaseXCFramework \
            -Pflavor=marketplace \
            -Penv=local \
            -Pmode=sample \
            --no-configuration-cache

      - name: Package and checksum
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            composeApp/build/XCFrameworks/release/ComposeApp.xcframework \
            ComposeApp.xcframework.zip
          echo "CHECKSUM=$(swift package compute-checksum ComposeApp.xcframework.zip)" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${VERSION}"
          gh release create "$TAG" ComposeApp.xcframework.zip \
            --title "ECCPlatform iOS $TAG" \
            --notes "XCFramework built from ECCSDUI $TAG" \
            --repo Indroids/ECCPlatformIOS 2>/dev/null || \
          gh release upload "$TAG" ComposeApp.xcframework.zip --clobber \
            --repo Indroids/ECCPlatformIOS
          echo "ZIP_URL=https://github.com/Indroids/ECCPlatformIOS/releases/download/${TAG}/ComposeApp.xcframework.zip" \
            >> "$GITHUB_ENV"

      - name: Update Package.swift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_SHA=$(gh api repos/Indroids/ECCPlatformIOS/contents/Package.swift \
            --jq '.sha' 2>/dev/null || echo "")
          CONTENT=$(python3 - <<EOF
import base64
src = """// swift-tools-version: 5.9
import PackageDescription

let package = Package(
    name: "ECCPlatformIOS",
    platforms: [.iOS(.v16)],
    products: [
        .library(name: "ECCPlatform", targets: ["ECCPlatform"])
    ],
    targets: [
        .binaryTarget(
            name: "ECCPlatform",
            url: "${ZIP_URL}",
            checksum: "${CHECKSUM}"
        )
    ]
)
"""
print(base64.b64encode(src.encode()).decode())
EOF
)
          if [ -n "$PKG_SHA" ]; then
            gh api --method PUT repos/Indroids/ECCPlatformIOS/contents/Package.swift \
              -f message="chore: update XCFramework to ${VERSION}" \
              -f content="$CONTENT" \
              -f sha="$PKG_SHA"
          else
            gh api --method PUT repos/Indroids/ECCPlatformIOS/contents/Package.swift \
              -f message="chore: init Package.swift for ${VERSION}" \
              -f content="$CONTENT"
          fi
