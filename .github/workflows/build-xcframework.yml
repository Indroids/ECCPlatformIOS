name: Build XCFramework

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'ecc-platform version to package (e.g. 1.0.36)'
        required: true
        type: string

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout ECCPlatformIOS
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Build XCFramework
        env:
          ECC_REPO_USER: ${{ secrets.ECC_REPO_USER }}
          ECC_REPO_PASS: ${{ secrets.ECC_REPO_PASS }}
          VERSION: ${{ inputs.version }}
        run: ./gradlew assembleECCPlatformReleaseXCFramework -Pecc.version="$VERSION" --no-configuration-cache

      - name: Package and checksum
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/XCFrameworks/release/ECCPlatform.xcframework \
            ECCPlatform.xcframework.zip
          CHECKSUM=$(swift package compute-checksum ECCPlatform.xcframework.zip)
          echo "CHECKSUM=$CHECKSUM" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION"   >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${VERSION}"
          gh release create "$TAG" ECCPlatform.xcframework.zip \
            --title "ECCPlatform iOS $TAG" \
            --notes "XCFramework built from ecc-platform $TAG" \
            --repo Indroids/ECCPlatformIOS 2>/dev/null || \
          gh release upload "$TAG" ECCPlatform.xcframework.zip --clobber \
            --repo Indroids/ECCPlatformIOS
          echo "ZIP_URL=https://github.com/Indroids/ECCPlatformIOS/releases/download/${TAG}/ECCPlatform.xcframework.zip" \
            >> "$GITHUB_ENV"

      - name: Update Package.swift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_SHA=$(gh api repos/Indroids/ECCPlatformIOS/contents/Package.swift \
            --jq '.sha' 2>/dev/null || echo "")

          printf '// swift-tools-version: 5.9\nimport PackageDescription\n\nlet package = Package(\n    name: "ECCPlatformIOS",\n    platforms: [.iOS(.v16)],\n    products: [\n        .library(name: "ECCPlatform", targets: ["ECCPlatform"])\n    ],\n    targets: [\n        .binaryTarget(\n            name: "ECCPlatform",\n            url: "%s",\n            checksum: "%s"\n        )\n    ]\n)\n' \
            "$ZIP_URL" "$CHECKSUM" > /tmp/Package.swift

          CONTENT=$(base64 < /tmp/Package.swift)

          if [ -n "$PKG_SHA" ]; then
            gh api --method PUT repos/Indroids/ECCPlatformIOS/contents/Package.swift \
              -f message="chore: update XCFramework to ${VERSION}" \
              -f content="$CONTENT" \
              -f sha="$PKG_SHA"
          else
            gh api --method PUT repos/Indroids/ECCPlatformIOS/contents/Package.swift \
              -f message="chore: init Package.swift for ${VERSION}" \
              -f content="$CONTENT"
          fi
